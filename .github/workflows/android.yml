name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared-models/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # AGP signs debug builds with ~/.android/debug.keystore. Without a stable one the runner
      # generates a fresh key per run, so each APK would fail to install over the last.
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.CAST_DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore

      - name: Test
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        working-directory: android
        env:
          CAST_VERSION_CODE: ${{ github.run_number }}
        run: |
          export CAST_VERSION_NAME="${{ github.run_number }}-${GITHUB_SHA::7}"
          ./gradlew --no-daemon assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cast-debug.apk
          gh release create "build-${{ github.run_number }}" cast-debug.apk \
            --title "build ${{ github.run_number }}" \
            --notes "${{ github.sha }}"
