name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared-models/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  # Auto-merged Dependabot PRs are merged by GITHUB_TOKEN, which doesn't fire push workflows.
  # The daily run picks those up; the changes job skips it when nothing Android-related is new.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        if: github.event_name == 'schedule'
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ] && git diff --quiet "$PREV" HEAD -- android shared-models; then
            echo skip=true >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # versionCode is the commit count; the changelog needs tags

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        run: |
          echo "CAST_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "CAST_VERSION_NAME=$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Test
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Each build is tagged, so the previous tag marks exactly what the last installed APK contained.
      - name: Build changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --pretty=format:'- %s' > CHANGELOG.md
          else
            git log -10 --pretty=format:'- %s' > CHANGELOG.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cast-debug.apk
          gh release create "v$CAST_VERSION_NAME" cast-debug.apk \
            --title "$CAST_VERSION_NAME" \
            --notes-file CHANGELOG.md
