name: CI

# Gate for pull requests (Dependabot auto-merge waits for these). Every job runs on every PR:
# path filters would leave required checks pending forever.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon test

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build server.tsx --target bun --outdir /tmp/webapp-build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon test assembleDebug

  # Build both images and boot the API: catches base-image bumps that break the build or drop tools.
  # The health probe is the same bash /dev/tcp command the server's compose healthcheck runs.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.api -t cast:ci .
      - run: docker build -t cast-webapp:ci webapp
      - name: Boot API and wait for health
        run: |
          docker run -d --name cast cast:ci
          for i in $(seq 30); do
            docker exec cast bash -c 'exec 3<>/dev/tcp/localhost/8100 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "' && exit 0
            sleep 2
          done
          docker logs cast
          exit 1
