name: Deploy

# Tests, then builds both images and pushes them to GHCR. The server's poller
# (cast-deployer in the hub compose) pulls :latest and restarts.
on:
  push:
    branches: [main]
    paths-ignore: ['android/**']
  schedule:
    - cron: '23 4 * * 0'   # weekly: pick up patched base images
  workflow_dispatch:

permissions:
  contents: read

# Queue, don't cancel: a cancelled run could leave only one of the two images pushed.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon test

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun build server.tsx --target bun --outdir /tmp/webapp-build

  images:
    needs: [server, webapp]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API: ghcr.io/${{ github.repository_owner }}/cast
      WEB: ghcr.io/${{ github.repository_owner }}/cast-webapp
      LABELS: >-
        --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
        --label org.opencontainers.image.revision=${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull $LABELS -f Dockerfile.api -t $API:latest -t $API:$GITHUB_SHA .
      - run: docker build --pull $LABELS -t $WEB:latest -t $WEB:$GITHUB_SHA webapp
      - name: Boot API and wait for health
        run: |
          docker run -d --name cast $API:latest
          for i in $(seq 30); do
            docker exec cast bash -c 'exec 3<>/dev/tcp/localhost/8100 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "' && exit 0
            sleep 2
          done
          docker logs cast
          exit 1
      # Push both only once both are built and the API boots, so the poller never sees a half-deploy for long.
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker push --all-tags $API && docker push --all-tags $WEB
