services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: cast:latest
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - db-data:/app/data
    environment:
      DB_PATH: /app/data/podcasts.db
    networks:
      - internal
    healthcheck:
      # bash /dev/tcp: the temurin 25 image has no wget or curl
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8100 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \" 200 \""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: cast-webapp:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      KOTLIN_API: http://api:8100
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  db-data:
